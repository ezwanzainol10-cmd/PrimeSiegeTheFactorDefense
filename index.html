<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prime Siege: The Factor Defense</title>
    <!-- Menyambungkan fail CSS luaran -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <!-- MENU UTAMA -->
        <div id="menu-screen" class="screen">
            <h1>PRIME SIEGE</h1>
            <p>DSKP Matematik Tingkatan 1: Bab 2 (2.1.1 & 2.1.2)</p>
            <button class="btn btn-diff" onclick="showDifficulty()">MULA PERTAHANAN</button>
        </div>

        <!-- PILIHAN TAHAP KESUKARAN -->
        <div id="difficulty-screen" class="screen hidden">
            <h1>PILIH INTENSITI</h1>
            <p>Semakin tinggi tahap, semakin ganas raksasa angka!</p>
            <button class="btn" style="background: #00cc7a;" onclick="startGame('mudah')">MUDAH (Faktor Asas)</button>
            <button class="btn" style="background: #ffb300;" onclick="startGame('sederhana')">SEDERHANA (Angka 2-Digit)</button>
            <button class="btn" style="background: #ff3e3e;" onclick="startGame('susah')">SUSAH (Ganas & Agresif)</button>
        </div>

        <!-- SKRIN TAMAT (MENANG/KALAH) -->
        <div id="gameover-screen" class="screen hidden">
            <h1 id="go-title">KUBI BOLOS!</h1>
            <p id="go-desc">Raksasa berjaya merobohkan benteng faktor anda.</p>
            <div id="final-chain-section" style="margin-bottom: 20px; width:100%; text-align:center;">
                <span style="color:#a0a5c0; font-size:0.9rem;">Pemfaktoran Tepat:</span>
                <div id="correct-ans-chain" style="margin-top:5px;"></div>
            </div>
            <button class="btn btn-diff" onclick="showDifficulty()">CUBA LAGI</button>
            <button class="btn" style="background:#222533;" onclick="backToMenu()">MENU UTAMA</button>
        </div>

        <!-- HUD PERMAINAN -->
        <div id="hud">
            <div class="hud-item" id="score-display">SKOR: 0</div>
            <div class="hud-item" id="timer">MASA: 45s</div>
        </div>

        <!-- MEDAN PERMAINAN (CANVAS) -->
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- PANEL KAWALAN MERIAM -->
        <div id="control-panel">
            <span class="section-title">Pemfaktoran Perdana Semasa</span>
            <div id="chain-container"></div>
            
            <span class="section-title">Peluru Meriam Perdana</span>
            <div id="ammo-grid">
                <button class="ammo-btn" onclick="fireLaser(2)">2</button>
                <button class="ammo-btn" onclick="fireLaser(3)">3</button>
                <button class="ammo-btn" onclick="fireLaser(5)">5</button>
                <button class="ammo-btn" onclick="fireLaser(7)">7</button>
            </div>
        </div>
    </div>

    <!-- Menyambungkan logik game dari fail JavaScript luaran -->
    <script src="game.js"></script>
</body>
</html>
