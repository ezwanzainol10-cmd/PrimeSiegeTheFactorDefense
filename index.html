<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Countdown: Skydiver Multi-Level Math</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #334155;
            border-radius: 8px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        .highlight-blue { color: #38bdf8; }
        .highlight-green { color: #22c55e; }

        /* Overlay Interface Screen Styles */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
        }
        #menuTitle {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }
        #menuReason {
            font-size: 16px;
            font-family: monospace;
            color: #94a3b8;
            margin-bottom: 30px;
            max-width: 80%;
        }
        .action-btn {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .action-btn:hover {
            background: #1d4ed8;
        }
        .action-btn:active {
            transform: scale(0.97);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div>LEVEL: <span id="levelVal" class="highlight-green">1</span></div>
        <div>SCORE: <span id="scoreVal" class="highlight-blue">0</span></div>
    </div>
    
    <!-- Robust Clickable Overlay for Restart & Level Transitions -->
    <div id="menuOverlay">
        <div id="menuTitle">SKY DIVE INITIALIZED</div>
        <div id="menuReason">Navigate down safely. Subtract countdown values to exactly 0.</div>
        <button id="actionBtn" class="action-btn">START MISSION</button>
    </div>

    <canvas id="gameCanvas" width="450" height="650"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreVal = document.getElementById("scoreVal");
const levelVal = document.getElementById("levelVal");

const menuOverlay = document.getElementById("menuOverlay");
const menuTitle = document.getElementById("menuTitle");
const menuReason = document.getElementById("menuReason");
const actionBtn = document.getElementById("actionBtn");

// Game State Progression Variables
let score = 0;
let currentLevel = 1;
let maxLevels = 5;
let isMenuState = true;
let menuMode = "start"; // options: "start", "lose", "win", "victory"
let gameSpeed = 2.2;
let targetNumber = 0;

// The Prime Math Pool Data
const primePool =;

// 4-Way Omni Playable Skydiver Configuration
const player = {
    x: canvas.width / 2,
    y: 150,
    radius: 20,
    speed: 6,
    vx: 0,
    vy: 0
};

// Key Controllers Dictionary
const keys = {};
window.addEventListener("keydown", e => { if(!isMenuState) keys[e.code] = true; });
window.addEventListener("keyup", e => { keys[e.code] = false; });

// Target interactive overlays management
actionBtn.addEventListener("click", () => {
    if (menuMode === "start" || menuMode === "lose" || menuMode === "victory") {
        if (menuMode === "lose" || menuMode === "victory") {
            score = 0;
            currentLevel = 1;
        }
        startLevel(currentLevel);
    } else if (menuMode === "win") {
        currentLevel++;
        startLevel(currentLevel);
    }
});

let hoops = [];
const hoopHeight = 16;
const hoopWidth = 85;
const hoopSpacing = 180;

// Level Configurator Matrix: dynamically controls speed and step complexities
function startLevel(level) {
    isMenuState = false;
    menuOverlay.classList.add("hidden");
    
    // Scale parameters systematically based on difficulty levels
    gameSpeed = 1.8 + (level * 0.4); 
    
    player.x = canvas.width / 2;
    player.y = 150;
    player.vx = 0;
    player.vy = 0;
    hoops = [];
    
    // Level difficulty alters calculation length chain values
    let chainLength = 2 + Math.floor(level / 2); // Level 1-2 = 2 steps, Level 3-4 = 3 steps, Level 5 = 4 steps
    let sum = 0;
    for(let i = 0; i < chainLength; i++) {
        sum += primePool[Math.floor(Math.random() * primePool.length)];
    }
    targetNumber = sum;

    scoreVal.innerText = score;
    levelVal.innerText = currentLevel;

    // Fill the sky path
    for (let i = 0; i < 4; i++) {
        spawnHoopRow(canvas.height + 20 + i * hoopSpacing);
    }
}

function triggerMenu(mode, reasonText = "") {
    isMenuState = true;
    menuMode = mode;
    menuOverlay.classList.remove("hidden");
    menuReason.innerText = reasonText;
    
    // Reset key map so player doesn't carry kinetic drifts into next load loop
    for (let key in keys) keys[key] = false;

    if (mode === "lose") {
        menuTitle.innerText = "CRASH DETECTED";
        menuTitle.style.color = "#f43f5e";
        actionBtn.innerText = "RESTART GAME";
    } else if (mode === "win") {
        menuTitle.innerText = "LEVEL CLEARED!";
        menuTitle.style.color = "#22c55e";
        actionBtn.innerText = `PROCEED TO LEVEL ${currentLevel + 1}`;
    } else if (mode === "victory") {
        menuTitle.innerText = "ULTIMATE VICTORY!!!";
        menuTitle.style.color = "#eab308";
        menuReason.innerText = `Incredible! You completed all ${maxLevels} high-altitude deployment sectors! Final Score: ${score}`;
        actionBtn.innerText = "PLAY AGAIN";
    }
}

function spawnHoopRow(yPosition) {
    let viableOptions = primePool.filter(p => targetNumber - p >= 0);
    let correctPrime = viableOptions.length > 0 ? viableOptions[Math.floor(Math.random() * viableOptions.length)] : 2;
    
    let decoys = primePool.filter(p => p !== correctPrime);
    let wrongPrime = decoys.length > 0 ? decoys[Math.floor(Math.random() * decoys.length)] : 3;

    let assignLeft = Math.random() > 0.5;
    let valueLeft = assignLeft ? correctPrime : wrongPrime;
    let valueRight = assignLeft ? wrongPrime : correctPrime;

    hoops.push({ x: 40, y: yPosition, value: valueLeft, passed: false });
    hoops.push({ x: canvas.width - 40 - hoopWidth, y: yPosition, value: valueRight, passed: false });
}

function drawSkydiver(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 1. Altimeter Equipment Pack Backpack
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(-18, -15, 36, 28);
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.strokeRect(-18, -15, 36, 28);

    // 2. Flight Torso Suit
    ctx.fillStyle = "#0284c7"; 
    ctx.fillRect(-12, -8, 24, 26);

    // 3. Sprawled Out Stabilizing Arms
    ctx.fillStyle = "#bae6fd";
    ctx.fillRect(-22, -6, 10, 8);  
    ctx.fillRect(12, -6, 10, 8);   
    
    // Trailing Stabilizing Legs
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-14, 18, 7, 14);  
    ctx.fillRect(7, 18, 7, 14);   

    // 4. Helmet Dome Structure
    ctx.fillStyle = "#ef4444"; 
    ctx.beginPath();
    ctx.arc(0, -20, 11, 0, Math.PI * 2);
    ctx.fill();

    // Protective visor glass screen
    ctx.fillStyle = "#22d3ee";
    ctx.fillRect(-7, -22, 14, 6);

    // 5. Draw the Target Countdown Value on the Backpack Display
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 14px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(targetNumber, 0, 0);

    ctx.restore();
}

function updateLoop() {
    if (!isMenuState) {
        // Handle 4-Way Omni Axis Controls
        if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
        else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;
        else player.vx = 0;

        if (keys["ArrowUp"] || keys["KeyW"]) player.vy = -player.speed;
        else if (keys["ArrowDown"] || keys["KeyS"]) player.vy = player.speed;
        else player.vy = 0;

        player.x += player.vx;
        player.y += player.vy;

        // Apply constant gravity drift if vertical controls are idle
        if (player.vy === 0) {
            player.y += gameSpeed * 0.35;
        }

        // Keep character bound completely within window canvas walls
        if (player.x - player.radius < 0) player.x = player.radius;
        if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;
        if (player.y - player.radius < 0) player.y = player.radius;
