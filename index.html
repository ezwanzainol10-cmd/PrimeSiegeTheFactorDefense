<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Countdown: Skydiver Edition</title>
    <style>
        /* GitHub Style Game Core Visual Elements */
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #334155;
            border-radius: 6px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 16px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            letter-spacing: 0.05em;
        }
        .highlight {
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">TARGETS_CLEARED: <span id="scoreVal" class="highlight">0</span></div>
    <canvas id="gameCanvas" width="450" height="600"></canvas>
</div>

<script>
/**
 * Zero Countdown Math Hoops: Skydiver Edition
 * Source target template optimized for GitHub project repository distribution.
 */
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreVal = document.getElementById("scoreVal");

let score = 0;
let gameOver = false;
let gameOverReason = "";
let gameSpeed = 2.5;
let targetNumber = 0;

// The mathematical factor pools
const primePool =;

// Skydiver Avatar State Configuration
const player = {
    x: canvas.width / 2,
    y: 120,
    width: 36,   // Body scale dimensions 
    height: 48,
    radius: 20,  // Kept hitbox indicator active for hoop math calculations
    speed: 6,
    vx: 0,
    vy: 0
};

const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

let hoops = [];
const hoopHeight = 16;
const hoopWidth = 80;
const hoopSpacing = 170; 

function generateTargetNumber() {
    let internalSum = 0;
    let steps = Math.floor(Math.random() * 3) + 2; 
    for(let i = 0; i < steps; i++) {
        internalSum += primePool[Math.floor(Math.random() * primePool.length)];
    }
    return internalSum;
}

function spawnHoopRow(yPosition) {
    let safePrimes = primePool.filter(p => targetNumber - p >= 0);
    let correctPrime = safePrimes.length > 0 ? safePrimes[Math.floor(Math.random() * safePrimes.length)] : 2;
    let wrongPrimes = primePool.filter(p => p !== correctPrime);
    let wrongPrime = wrongPrimes.length > 0 ? wrongPrimes[Math.floor(Math.random() * wrongPrimes.length)] : 3;

    let sideElement = Math.random() > 0.5;
    let primeLeft = sideElement ? correctPrime : wrongPrime;
    let primeRight = sideElement ? wrongPrime : correctPrime;

    hoops.push({ x: 45, y: yPosition, value: primeLeft, passed: false });
    hoops.push({ x: canvas.width - 45 - hoopWidth, y: yPosition, value: primeRight, passed: false });
}

function resetGame() {
    score = 0;
    gameOver = false;
    gameOverReason = "";
    gameSpeed = 2.5;
    player.x = canvas.width / 2;
    player.y = 120;
    player.vx = 0;
    player.vy = 0;
    hoops = [];
    
    targetNumber = generateTargetNumber();
    scoreVal.innerText = score;

    for (let i = 0; i < 4; i++) {
        spawnHoopRow(canvas.height + 40 + i * hoopSpacing);
    }
    requestAnimationFrame(update);
}

// Custom 2D Graphics Canvas Renderer Engine for the Skydiver Character Layout
function drawSkydiver(ctx, x, y) {
    ctx.save();
    
    // Smooth frame layout translations
    ctx.translate(x, y);

    // 1. Draw Parachute Pack (Backpack) with text screen container
    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(-16, -14, 32, 26);
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.strokeRect(-16, -14, 32, 26);

    // 2. Jumpsuit Body Frame (Torso)
    ctx.fillStyle = "#38bdf8"; // Sky Blue Flight Suit
    ctx.fillRect(-10, -8, 20, 24);

    // 3. Falling Outstretched Limbs (Left and Right Diving Arms)
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-18, -6, 8, 6);   // Left Arm
    ctx.fillRect(10, -6, 8, 6);    // Right Arm
    
    // Diving Legs (Outward stability layout)
    ctx.fillRect(-12, 16, 6, 12);   // Left Leg
    ctx.fillRect(6, 16, 6, 12);    // Right Leg

    // 4. Skydiver Goggles Visor Helm (Head)
    ctx.fillStyle = "#f43f5e"; // Bright Red Safety Helmet
    ctx.beginPath();
    ctx.arc(0, -18, 10, 0, Math.PI * 2);
    ctx.fill();

    // Neon Flight Visor glass overlay
    ctx.fillStyle = "#22d3ee"; 
    ctx.fillRect(-6, -20, 12, 5);

    // 5. Render Altimeter/Countdown Numeric Font Value right on the Backpack display
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 13px ui-monospace, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(targetNumber, 0, 0);

    ctx.restore();
}

function update() {
    if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = gameOverReason.includes("WIN") ? "#22c55e" : "#ef4444";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(gameOverReason.includes("WIN") ? "MISSION SUCCESS" : "CRASH DETECTED", canvas.width / 2, canvas.height / 2 - 30);
        
        ctx.fillStyle = "#94a3b8";
        ctx.font = "15px monospace";
        ctx.fillText(gameOverReason, canvas.width / 2, canvas.height / 2 + 10);
        
        ctx.fillStyle = "#f8fafc";
        ctx.font = "13px sans-serif";
        ctx.fillText("Press [SPACEBAR] to redeploy", canvas.width / 2, canvas.height / 2 + 60);
        
        if (keys["Space"]) resetGame();
        else requestAnimationFrame(update);
        return;
    }

    // 4-Way Keyboard Tracking Updates
    if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
    else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;
    else player.vx = 0;

    if (keys["ArrowUp"] || keys["KeyW"]) player.vy = -player.speed;
    else if (keys["ArrowDown"] || keys["KeyS"]) player.vy = player.speed;
    else player.vy = 0;

    player.x += player.vx;
    player.y += player.vy;

    // Simulate atmospheric descent velocity if no vertical layout keystrokes are active
    if (player.vy === 0) {
        player.y += gameSpeed * 0.35;
    }

    // Canvas boundary tracking locks
    if (player.x - player.radius < 0) player.x = player.radius;
    if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;
    if (player.y - player.radius < 0) player.y = player.radius;
    if (player.y + player.radius > canvas.height) player.y = canvas.height - player.radius;

    // Intersecting Loop logic for mathematical evaluation
    for (let i = 0; i < hoops.length; i++) {
        let h = hoops[i];
        h.y -= gameSpeed; 

        if (!h.passed && player.y + 10 >= h.y && player.y - 10 <= h.y + hoopHeight) {
            if (player.x > h.x && player.x < h.x + hoopWidth) {
                h.passed = true;
                let sibling = hoops.find(o => o !== h && Math.abs(o.y - h.y) < 5);
                if (sibling) sibling.passed = true;

                targetNumber -= h.value;

                if (targetNumber === 0) {
                    score++;
                    scoreVal.innerText = score;
                    gameSpeed += 0.25;
                    gameOver = true;
                    gameOverReason = "ALTITUDE STABILIZED AT EXACTLY 0!";
                    return;
                } else if (targetNumber < 0) {
                    gameOver = true;
                    gameOverReason = `Target breached below zero down to ${targetNumber}!`;
                    return;
                }
            }
        }
    }

    // Recycling hoop structures logic
    if (hoops.length > 0 && hoops[0].y < -hoopHeight) {
        hoops.shift(); 
        hoops.shift(); 
        let lastItemY = hoops.length > 0 ? hoops[hoops.length - 1].y : canvas.height;
        spawnHoopRow(lastItemY + hoopSpacing);
    }

    if (player.y - player.radius <= 0) {
        gameOver = true;
        gameOverReason = "Diver went off-screen up top!";
    }
    if (player.y + player.radius >= canvas.height) {
        gameOver = true;
        gameOverReason = "Ground impact! Parachute deployment failed.";
    }

    // Screen Render Updates
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw the diving path portals
    hoops.forEach(h => {
        ctx.fillStyle = "#f59e0b"; // Golden neon gates
        ctx.fillRect(h.x - 6, h.y, 6, hoopHeight);
        ctx.fillRect(h.x + hoopWidth, h.y, 6, hoopHeight);
        ctx.fillStyle = "rgba(245, 158, 11, 0.08)";
        ctx.fillRect(h.x, h.y, hoopWidth, hoopHeight);
        
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "center";
        ctx.fillText("-" + h.value, h.x + (hoopWidth / 2), h.y - 6);
    });

    // Render the custom Skydiver vector character asset in place of the old ball
    drawSkydiver(ctx, player.x, player.y);

    requestAnimationFrame(update);
}

// Initial engine activation
resetGame();
</script>
</body>
</html>
