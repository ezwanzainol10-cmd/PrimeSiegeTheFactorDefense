<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Countdown Math Hoops</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #334155;
            background: #1e293b;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">TARGETS HIT: <span id="scoreVal">0</span></div>
    <canvas id="gameCanvas" width="450" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreVal = document.getElementById("scoreVal");

// Game configurations
let score = 0;
let gameOver = false;
let gameOverReason = "";
let gameSpeed = 2.5;
let targetNumber = 0;

// Prime number pool
const primePool =;

// Player configuration with speed variables
const player = {
    x: canvas.width / 2,
    y: 120,
    radius: 20, // Expanded slightly to fit double digits easily
    speed: 6,
    vx: 0,
    vy: 0
};

// Key controls tracking
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Hoops configurations
let hoops = [];
const hoopHeight = 15;
const hoopWidth = 75;
const hoopSpacing = 165; 

// Generate a target number constructed cleanly by summing up a sequence of primes from our pool
function generateTargetNumber() {
    let internalSum = 0;
    // Chain 2 to 4 random primes together to create the subtraction sequence puzzle
    let steps = Math.floor(Math.random() * 3) + 2; 
    
    for(let i = 0; i < steps; i++) {
        internalSum += primePool[Math.floor(Math.random() * primePool.length)];
    }
    return internalSum;
}

function spawnHoopRow(yPosition) {
    // Pick one safe prime option that doesn't force the target below 0 instantly
    let safePrimes = primePool.filter(p => targetNumber - p >= 0);
    
    // If no primes can cleanly keep it >= 0, just offer a random small pool choice as fallback
    let correctPrime = safePrimes.length > 0 ? safePrimes[Math.floor(Math.random() * safePrimes.length)] : primePool[0];
    
    // Choose a decoy prime
    let wrongPrimes = primePool.filter(p => p !== correctPrime);
    let wrongPrime = wrongPrimes[Math.floor(Math.random() * wrongPrimes.length)];

    let sideElement = Math.random() > 0.5;
    let primeLeft = sideElement ? correctPrime : wrongPrime;
    let primeRight = sideElement ? wrongPrime : correctPrime;

    hoops.push({
        x: 50,
        y: yPosition,
        value: primeLeft,
        passed: false
    });

    hoops.push({
        x: canvas.width - 50 - hoopWidth,
        y: yPosition,
        value: primeRight,
        passed: false
    });
}

function resetGame() {
    score = 0;
    gameOver = false;
    gameOverReason = "";
    gameSpeed = 2.5;
    player.x = canvas.width / 2;
    player.y = 120;
    player.vx = 0;
    player.vy = 0;
    hoops = [];
    
    targetNumber = generateTargetNumber();
    scoreVal.innerText = score;

    for (let i = 0; i < 4; i++) {
        spawnHoopRow(canvas.height + 40 + i * hoopSpacing);
    }
    requestAnimationFrame(update);
}

function update() {
    if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = gameOverReason.includes("WIN") ? "#22c55e" : "#f43f5e";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(gameOverReason.includes("WIN") ? "SUCCESS!" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 40);
        
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "16px sans-serif";
        ctx.fillText(gameOverReason, canvas.width / 2, canvas.height / 2);
        
        ctx.fillStyle = "#fff";
        ctx.font = "14px sans-serif";
        ctx.fillText("Press SPACE to start next loop", canvas.width / 2, canvas.height / 2 + 50);
        
        if (keys["Space"]) resetGame();
        else requestAnimationFrame(update);
        return;
    }

    // Horizontal Controls
    if (keys["ArrowLeft"] || keys["KeyA"]) player.vx = -player.speed;
    else if (keys["ArrowRight"] || keys["KeyD"]) player.vx = player.speed;
    else player.vx = 0;

    // Vertical Controls (Fully functional flying up/down)
    if (keys["ArrowUp"] || keys["KeyW"]) player.vy = -player.speed;
    else if (keys["ArrowDown"] || keys["KeyS"]) player.vy = player.speed;
    else player.vy = 0;

    player.x += player.vx;
    player.y += player.vy;

    // Simulate passive camera drift down if vertical movement idle
    if (player.vy === 0) {
        player.y += gameSpeed * 0.35;
    }

    // Canvas boundary safety limits
    if (player.x - player.radius < 0) player.x = player.radius;
    if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;
    if (player.y - player.radius < 0) player.y = player.radius;
    if (player.y + player.radius > canvas.height) player.y = canvas.height - player.radius;

    // Track hoop positions and check clean overlaps
    for (let i = 0; i < hoops.length; i++) {
        let h = hoops[i];
        h.y -= gameSpeed; 

        if (!h.passed && player.y + player.radius >= h.y && player.y - player.radius <= h.y + hoopHeight) {
            if (player.x > h.x && player.x < h.x + hoopWidth) {
                h.passed = true;
                
                // Disable sister hoop block
                let sibling = hoops.find(o => o !== h && Math.abs(o.y - h.y) < 5);
                if (sibling) sibling.passed = true;

                // Execute Math subtraction action rule updates
                targetNumber -= h.value;

                if (targetNumber === 0) {
                    score++;
                    scoreVal.innerText = score;
                    gameSpeed += 0.2;
                    gameOver = true;
                    gameOverReason = "YOU HIT EXACTLY ZERO! YOU WIN!";
                    return;
                } else if (targetNumber < 0) {
                    gameOver = true;
                    gameOverReason = `Oops! Dropped below zero down to ${targetNumber}!`;
                    return;
                }
            }
        }
    }

    // Cycle fresh rows
    if (hoops.length > 0 && hoops.y < -hoopHeight) {
        hoops.shift(); 
        hoops.shift(); 
        
        let lastItemY = hoops.length > 0 ? hoops[hoops.length - 1].y : canvas.height;
        spawnHoopRow(lastItemY + hoopSpacing);
    }

    // Map boundaries crash triggers
    if (player.y - player.radius <= 0) {
        gameOver = true;
        gameOverReason = "You crashed into the ceiling!";
    }
    if (player.y + player.radius >= canvas.height) {
        gameOver = true;
        gameOverReason = "You dropped out the bottom floor!";
    }

    // Canvas Rendering Loops
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw active Hoop lanes
    hoops.forEach(h => {
        ctx.fillStyle = "#38bdf8"; 
        ctx.fillRect(h.x - 6, h.y, 6, hoopHeight);
        ctx.fillRect(h.x + hoopWidth, h.y, 6, hoopHeight);
        
        ctx.fillStyle = "rgba(56, 189, 248, 0.12)";
        ctx.fillRect(h.x, h.y, hoopWidth, hoopHeight);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px monospace";
        ctx.textAlign = "center";
        ctx.fillText("-" + h.value, h.x + (hoopWidth / 2), h.y - 6); // Displays math tag cleanly
    });

    // Draw Avatar Ball
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#fbbf24"; 
    ctx.fill();
    ctx.closePath();

    // Render active countdown number state on player character
    ctx.fillStyle = "#0f172a"; 
    ctx.font = "bold 15px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(targetNumber, player.x, player.y);

    requestAnimationFrame(update);
}

resetGame();
</script>

</body>
</html>
