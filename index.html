<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Countdown: Skydiver Multi-Level Math</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #334155;
            border-radius: 8px;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
        .highlight-blue { color: #38bdf8; }
        .highlight-green { color: #22c55e; }

        /* Enhanced High-Visibility Menu Overlay Screen */
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        #menuTitle {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        #menuReason {
            font-size: 16px;
            font-family: monospace;
            color: #94a3b8;
            margin-bottom: 35px;
            max-width: 85%;
            line-height: 1.5;
        }
        
        /* Upgraded High-Visibility Neon Arcade Action Button */
        .action-btn {
            background: #2563eb;
            color: #fff;
            border: 2px solid #3b82f6;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
            transition: all 0.15s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .action-btn:hover {
            background: #1d4ed8;
            border-color: #60a5fa;
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.9);
            transform: translateY(-2px);
        }
        .action-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div>LEVEL: <span id="levelVal" class="highlight-green">1</span></div>
        <div>SCORE: <span id="scoreVal" class="highlight-blue">0</span></div>
    </div>
    
    <!-- Active Game Interaction Menu UI Layer -->
    <div id="menuOverlay">
        <div id="menuTitle">SKY DIVE INITIALIZED</div>
        <div id="menuReason">Steer down safely. Pass through the portal hoops to subtract your countdown target down to exactly 0.</div>
        <button id="actionBtn" class="action-btn">START MISSION</button>
    </div>

    <canvas id="gameCanvas" width="450" height="650"></canvas>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreVal = document.getElementById("scoreVal");
const levelVal = document.getElementById("levelVal");

const menuOverlay = document.getElementById("menuOverlay");
const menuTitle = document.getElementById("menuTitle");
const menuReason = document.getElementById("menuReason");
const actionBtn = document.getElementById("actionBtn");

// Game Progression Configurations
let score = 0;
let currentLevel = 1;
let maxLevels = 5;
let isMenuState = true;
let menuMode = "start"; // Modes: "start", "lose", "win", "victory"
let gameSpeed = 2.2;
let targetNumber = 0;

// FIXED: Prime number dataset fully loaded to prevent application engine freeze codes
const primePool =;

// 4-Way Omni Skydiver Configuration Structure
const player = {
    x: canvas.width / 2,
    y: 150,
    radius: 20,
    speed: 6,
    vx: 0,
    vy: 0
};

// Keyboard Action Dictionary
const keys = {};

window.addEventListener("keydown", e => { 
    if (!isMenuState) {
        keys[e.code] = true; 
    } else if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault(); // Stop webpage from scrolling when spacebar is pressed
        triggerMenuAction();
    }
});

window.addEventListener("keyup", e => { 
    keys[e.code] = false; 
});

// Attach execution link directly onto our upgraded UI dashboard overlay buttons
actionBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    triggerMenuAction();
});

function triggerMenuAction() {
    if (menuMode === "start" || menuMode === "lose" || menuMode === "victory") {
        if (menuMode === "lose" || menuMode === "victory") {
            score = 0;
            currentLevel = 1;
        }
        startLevel(currentLevel);
    } else if (menuMode === "win") {
        currentLevel++;
        startLevel(currentLevel);
    }
}

let hoops = [];
const hoopHeight = 16;
const hoopWidth = 85;
const hoopSpacing = 180;

function startLevel(level) {
    isMenuState = false;
    menuOverlay.classList.add("hidden");
    
    // Smooth speed scaling parameters per level difficulty metric
    gameSpeed = 1.8 + (level * 0.45); 
    
    player.x = canvas.width / 2;
    player.y = 150;
    player.vx = 0;
    player.vy = 0;
    hoops = [];
    
    // Scale steps equation sizes relative to standard levels matrix
    let chainLength = 2 + Math.floor(level / 2); 
    let sum = 0;
    for(let i = 0; i < chainLength; i++) {
        sum += primePool[Math.floor(Math.random() * primePool.length)];
    }
    targetNumber = sum;

    scoreVal.innerText = score;
    levelVal.innerText = currentLevel;

    // Prefill the sky tracking bounds blocks rows
    for (let i = 0; i < 4; i++) {
        spawnHoopRow(canvas.height + 20 + i * hoopSpacing);
    }
}

function triggerMenu(mode, reasonText = "") {
    isMenuState = true;
    menuMode = mode;
    menuOverlay.classList.remove("hidden");
    menuReason.innerText = reasonText;
    
    // Force clear inputs map array matrices cache
    for (let key in keys) keys[key] = false;

    if (mode === "lose") {
        menuTitle.innerText = "CRASH DETECTED";
        menuTitle.style.color = "#f43f5e";
        menuTitle.style.textShadow = "0 0 12px rgba(244, 63, 94, 0.6)";
        actionBtn.innerText = "REDEPLOY SYSTEM (RESTART)";
        actionBtn.style.background = "#dc2626";
        actionBtn.style.borderColor = "#ef4444";
        actionBtn.style.boxShadow = "0 0 15px rgba(220, 38, 38, 0.6)";
    } else if (mode === "win") {
        menuTitle.innerText = "SECTOR SECURED!";
        menuTitle.style.color = "#22c55e";
        menuTitle.style.textShadow = "0 0 12px rgba(34, 197, 94, 0.6)";
        actionBtn.innerText = `NEXT SECTOR (LEVEL ${currentLevel + 1})`;
        actionBtn.style.background = "#16a34a";
        actionBtn.style.borderColor = "#22c55e";
        actionBtn.style.boxShadow = "0 0 15px rgba(22, 163, 74, 0.6)";
    } else if (mode === "victory") {
        menuTitle.innerText = "CELESTIAL VICTORY!!!";
        menuTitle.style.color = "#eab308";
        menuTitle.style.textShadow = "0 0 15px rgba(234, 179, 8, 0.7)";
        menuReason.innerText = `Outstanding! You successfully managed all ${maxLevels} high-velocity deployment drops! Final Score: ${score}`;
        actionBtn.innerText = "START NEW RUN";
        actionBtn.style.background = "#2563eb";
        actionBtn.style.borderColor = "#3b82f6";
        actionBtn.style.boxShadow = "0 0 15px rgba(37, 99, 235, 0.6)";
    }
}

function spawnHoopRow(yPosition) {
    let viableOptions = primePool.filter(p => targetNumber - p >= 0);
    let correctPrime = viableOptions.length > 0 ? viableOptions[Math.floor(Math.random() * viableOptions.length)] : 2;
    
    let decoys = primePool.filter(p => p !== correctPrime);
    let wrongPrime = decoys.length > 0 ? decoys[Math.floor(Math.random() * decoys.length)] : 3;

    let assignLeft = Math.random() > 0.5;
    let valueLeft = assignLeft ? correctPrime : wrongPrime;
    let valueRight = assignLeft ? wrongPrime : correctPrime;

    hoops.push({ x: 40, y: yPosition, value: valueLeft, passed: false });
    hoops.push({ x: canvas.width - 40 - hoopWidth, y: yPosition, value: valueRight, passed: false });
}

function drawSkydiver(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 1. Equipment Altimeter Backpack Pack Layout
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(-18, -15, 36, 28);
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.strokeRect(-18, -15, 36, 28);

    // 2. Main Body flight Torso Suit
    ctx.fillStyle = "#0284c7"; 
    ctx.fillRect(-12, -8, 24, 26);

    // 3. Sprawled Out Stabilizing Fluid Extremities
    ctx.fillStyle = "#bae6fd";
    ctx.fillRect(-22, -6, 10, 8);  
    ctx.fillRect(12, -6, 10, 8);   
    
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-14, 18, 7, 14);
